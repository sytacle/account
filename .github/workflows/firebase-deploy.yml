# @format

name: Deploy to Firebase Hosting (Production)

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Inject environment variables
        run: |
          echo "VITE_ONESIGNAL_APP_ID=${{ secrets.VITE_ONESIGNAL_APP_ID }}" >> .env
          echo "VITE_RECAPTCHA_SITE_KEY=${{ secrets.VITE_RECAPTCHA_SITE_KEY }}" >> .env
          echo "VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}" >> .env
          echo "VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}" >> .env
          echo "VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}" >> .env
          echo "VITE_FIREBASE_DATABASE_URL=${{ secrets.VITE_FIREBASE_DATABASE_URL }}" >> .env
          echo "VITE_FIREBASE_STORAGE_BUCKET_URL=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET_URL }}" >> .env
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}" >> .env
          echo "VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}" >> .env
          echo "VITE_FIREBASE_MEASUREMENT_ID=${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}" >> .env
          echo "VITE_OAUTH_API_URL=${{ secrets.VITE_OAUTH_API_URL }}" >> .env
          echo "VITE_ACCOUNT_API_URL=${{ secrets.VITE_ACCOUNT_API_URL }}" >> .env
          echo "VITE_SSO_HUB_ORIGIN=${{ secrets.VITE_SSO_HUB_ORIGIN }}" >> .env
          echo "VITE_REST_COUNTRIES_URL=${{ secrets.VITE_REST_COUNTRIES_URL }}" >> .env
          echo "VITE_REST_COUNTRIES_API_KEY=${{ secrets.VITE_REST_COUNTRIES_API_KEY }}" >> .env
          echo "VITE_LOGIN_PATH=${{ secrets.VITE_LOGIN_PATH }}" >> .env
          echo "VITE_SSO_ALLOWED_REDIRECTS=${{ secrets.VITE_SSO_ALLOWED_REDIRECTS }}" >> .env

      - name: Build project
        run: npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Authenticate with Firebase using Service Account
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SYTACLE }}' > "${HOME}/gcloud.json"
          export GOOGLE_APPLICATION_CREDENTIALS="${HOME}/gcloud.json"
          firebase deploy --only hosting --non-interactive --project=sytacle
